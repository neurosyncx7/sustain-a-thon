name: inventory

# R6 on the whole real archive: national screen -> per-site final stacks -> nulls -> BY-FDR ->
# Monte Carlo rates -> WRPI priority. Commits the versioned outputs to main (which redeploys the site).
on:
  workflow_run:
    workflows: [extract-sites, extract-tropomi]
    types: [completed]
  schedule:
    - cron: "23 5 * * *"      # after the daily live ingest
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: inventory
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q pandas pyarrow numpy scipy pillow shapely requests cryptography
      - name: Fetch the archive (data branch)
        run: git clone --depth 1 --branch data "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" databranch
      - name: ERA5 transport factor per site (weekly refresh)
        run: |
          f=data-pipeline/inventory/gamma.json
          last=$(git log -1 --format=%ct -- $f 2>/dev/null); last=${last:-0}
          if [ ! -f $f ] || [ "$last" -lt $(( $(date +%s) - 604800 )) ]; then
            mkdir -p data-pipeline/inventory && python research/pipeline/fetch_gamma.py research/pipeline/inventory_sites.json $f
          fi
      - name: USD/INR (ECB reference via frankfurter.dev)
        id: fx
        run: |
          r=$(curl -sL --max-time 20 "https://api.frankfurter.dev/v1/latest?base=USD&symbols=INR" || true)
          rate=$(echo "$r" | jq -r '.rates.INR // empty' 2>/dev/null || true); d=$(echo "$r" | jq -r '.date // empty' 2>/dev/null || true)
          if [ -n "$rate" ]; then echo "fx=$rate" >> "$GITHUB_OUTPUT"; echo "src=ECB reference rate via frankfurter.dev, $d" >> "$GITHUB_OUTPUT";
          else echo "fx=83.7" >> "$GITHUB_OUTPUT"; echo "src=RBI reference rate, 2024 annual average (fallback)" >> "$GITHUB_OUTPUT"; fi
      - name: National screen + labels
        run: |
          python research/screening/national_screen.py databranch data-pipeline/web web/public/data
          python research/screening/label_candidates.py data-pipeline/web/candidates.json research/screening/ne_min
          python research/pipeline/extraction_summary.py databranch
      - name: Grow the tested family with new screen leads (stable ids)
        id: fam
        run: |
          f=research/pipeline/new_sites/$(date -u +%Y%m%d).json
          n=$(python research/pipeline/make_inventory_sites.py --new-out $f)
          echo "added=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" -gt 0 ]; then
            python -c "import json,datetime as d;t=d.date.today();m=[f'{y}-{k:02d}' for y in range(2023,t.year+1) for k in range(1,13) if (y,k)<=(t.year,t.month)];json.dump(dict(months=m,tag='inv-'+t.strftime('%Y%m%d'),sites_file='$f',note='new screen leads added to the tested family'),open('.github/extract-sites-request.json','w'),indent=1)"
          else rm -f $f; fi
      - name: OpenStreetMap facilities near every site (EFA input; new sites only)
        continue-on-error: true
        timeout-minutes: 20
        run: python research/pipeline/fetch_osm.py research/pipeline/inventory_sites.json data-pipeline/inventory/osm.json
      - name: R5 tests that need live inputs (EFA, VOIT)
        continue-on-error: true
        run: python research/validation/r5_algorithms.py databranch data-pipeline/r5 efa voit
      - name: Inventory (validated algorithms only)
        env:
          INVENTORY_KEY: ${{ secrets.INVENTORY_KEY }}
        run: >
          python research/pipeline/run_inventory.py databranch data-pipeline/inventory
          --gamma data-pipeline/inventory/gamma.json --fx "${{ steps.fx.outputs.fx }}" --fx-source "${{ steps.fx.outputs.src }}"
      - run: python research/pipeline/algorithms_registry.py && python research/pipeline/findings_inventory.py
      - name: Record the run
        run: |
          jq -n --arg id "${{ github.run_id }}" --arg ev "${{ github.event_name }}" --arg t "$(date -u +%FT%TZ)" \
            '{run_id:$id, trigger:$ev, finished_utc:$t}' > data-pipeline/inventory/run.json
      - name: Commit outputs to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data-pipeline web/public/data research/findings.md research/pipeline .github/extract-sites-request.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -q -m "data: inventory refresh (run ${{ github.run_id }})"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin main && break; sleep $((i*7)); done
      - name: Extract windows for new leads (they join the next inventory run)
        if: steps.fam.outputs.added != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run extract-sites.yml --ref main
